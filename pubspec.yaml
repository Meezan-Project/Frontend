name: mezaan
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  share_plus: ^7.2.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  video_player: ^2.11.1
  video_player_media_kit: ^2.0.0
  camera: ^0.11.1
  http: ^1.6.0
  image_picker: ^1.1.2
  image: ^4.5.4
  google_mlkit_text_recognition: ^0.15.0
  google_mlkit_translation: ^0.13.0
  get: ^4.6.6
  google_fonts: ^6.2.1
  geolocator: ^14.0.1
  geocoding: 4.0.0
  google_maps_flutter: ^2.4.0
  flutter_map: ^8.3.0
  latlong2: ^0.9.1
  url_launcher: ^6.3.2
  flutter_screenutil: ^5.9.3
  firebase_core: ^4.7.0
  firebase_auth: ^6.1.1
  cloud_firestore: ^6.0.3
  firebase_storage: ^13.0.3
  firebase_messaging: 16.2.0
  flutter_local_notifications: ^18.0.1
  flutter_contacts: ^1.1.9+2
  shared_preferences: ^2.5.3
  google_sign_in: ^6.3.0
  google_generative_ai: ^0.4.7
  supabase_flutter: ^2.12.4
  permission_handler: ^11.3.1
  file_picker: ^8.1.4
  flutter_rating_bar: ^4.0.1
  agora_rtc_engine: ^6.5.3
  timezone: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:

  uses-material-design: true

  assets:
    - assets/icons/app_launcher_icon.png
    - assets/images/app_icon.png
    - assets/images/
    - assets/videos/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icons/app_launcher_icon.png
  min_sdk_android: 21
